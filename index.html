<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carpools: Hiking Club at UCSD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#e9eeea;--ink:#16211b;--pine:#1f4a35;--pine-d:#143426;--rock:#5f6f66;--line:#c5d0c8;--card:#f8faf8;--sun:#f2b441;--sun-bg:#fdf0cf;--bad:#a93226}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;line-height:1.1}
header{background:var(--pine-d);color:#eef3ef;padding:28px 20px 24px;border-bottom:6px solid var(--sun)}
.wrap{max-width:860px;margin:0 auto}
header .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(28px,6vw,44px);font-weight:800}
header .club-link{display:inline-block;margin-top:6px;color:#dce8df;font-size:14px;text-underline-offset:3px}
main{padding:22px 16px 60px}
button{font:inherit;cursor:pointer;border:1px solid var(--pine);background:var(--pine);color:#fff;border-radius:6px;padding:8px 14px;font-weight:600}
button:hover{background:var(--pine-d)}
button.ghost{background:transparent;color:var(--pine)}
button.ghost:hover{background:#dde7e0}
header button.ghost{color:#eef3ef;border-color:#7f9a89}
header button.ghost:hover{background:#25503b}
button.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
button.danger:hover{background:#f6e3e0}
button.small{padding:3px 9px;font-size:14px}
input,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.dest{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:22px;overflow:hidden}
.dest>.head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dest h2{font-size:24px}
.body{padding:16px 18px}
.dest button[data-act=offer]{margin-bottom:14px}
.car{border:1px solid var(--line);border-left:5px solid var(--pine);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:#fff}
.car.full{border-left-color:var(--rock)}
.car .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.car .who{font-weight:700}
.car .meta{color:var(--rock);font-size:14px}
.seats{font-weight:700;color:var(--pine)}
.car.full .seats{color:var(--rock)}
ul{list-style:none;margin:10px 0 0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;flex-wrap:wrap}
li+li{margin-top:2px}
li.hl{background:var(--sun-bg);box-shadow:inset 4px 0 0 var(--sun)}
li .ph{color:var(--rock);font-size:14px;margin-left:8px}
.acts{display:flex;gap:6px}
.open-seat{color:var(--rock);font-style:italic;padding:6px 8px}
.wait{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.wait h3{margin:0 0 4px;font-size:16px}
.empty{color:var(--rock);padding:10px 0}
.hostbar{background:var(--sun-bg);border:1px solid var(--sun);border-radius:8px;padding:12px 14px;margin-bottom:22px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hostbar strong{margin-right:auto}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;display:none;z-index:9}
#msg.err{background:var(--bad)}
.setup{background:#fff;border:2px solid var(--bad);border-radius:8px;padding:16px}
.dest>.head,.acts{flex-wrap:wrap}
.dest h2,.hike-info dd,.head p{overflow-wrap:anywhere}
.head p{margin:6px 0 0}
.waiver{margin:0 0 18px;padding:12px 16px;background:var(--sun-bg);border-left:4px solid var(--sun);border-radius:6px}
.car-fee{margin:5px 0 0;overflow-wrap:anywhere}
.hike-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px 18px;background:#e3ebe5;padding:12px 14px;border-radius:8px;margin:0 0 18px}
.hike-info dt{font-size:14px;color:var(--rock)}
.hike-info dd{margin:0;white-space:pre-line}
a{color:var(--pine)}
.attendees{border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.attendees h3{margin:0 0 8px;font-size:18px}
.attendees ul{margin:0 0 10px}
dialog{width:min(520px,calc(100% - 24px));max-height:90vh;padding:20px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px}
dialog::backdrop{background:#14251bb0}
dialog h2{margin-bottom:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(185px,100%),1fr));gap:12px}
.fields label{display:grid;gap:4px;align-content:start;font-size:14px;font-weight:600}
.fields label[hidden]{display:none}
.fields input,.fields textarea{width:100%;font-size:16px;font-weight:400}
.wide{grid-column:1/-1}
dialog textarea{resize:vertical}
dialog .acts{margin-top:16px;justify-content:flex-end}
.form-error{color:var(--bad);font-weight:600}
.form-error:empty{display:none}
</style>
</head>
<body>
<header><div class="wrap">
  <div><h1>Carpools: Hiking Club at UCSD</h1><a class="club-link" href="https://www.instagram.com/hikingclubatucsd/">Instagram @hikingclubatucsd</a></div>
  <button class="ghost" id="hostBtn" data-act="hostToggle">Host login</button>
</div></header>
<main class="wrap">
  <p class="waiver"><strong>First hike with the club?</strong> <a href="https://docs.google.com/forms/d/e/1FAIpQLScuax1QKxfYMH6fqKvNW5aHetM5rffwePlgP7EL4zzC_O_XOw/viewform" target="_blank" rel="noopener noreferrer">Sign the hiking waiver</a> before signing up. You only need to sign once.</p>
  <div id="host"></div>
  <div id="app"><p class="empty">Loading…</p></div>
</main>
<div id="msg" role="status"></div>
<dialog id="hikeEditor" aria-labelledby="hikeEditorTitle">
  <form><h2 id="hikeEditorTitle">Edit hike</h2>
    <div class="fields">
      <label class="wide">Hike name<input name="name" required placeholder="Fletcher Point"></label>
      <label>Carpool meeting time<input name="meeting_time" placeholder="Sun 10:30 a.m."></label>
      <label>Carpool meeting location<input name="meeting_location" placeholder="Price Center Loop"></label>
      <label>ETA at trailhead<input name="trailhead_eta" placeholder="Sun 11:00 a.m."></label>
      <label>Recommended fee per passenger<input name="passenger_fee" placeholder="$4"></label>
      <label>Length<input name="distance" placeholder="3 miles"></label>
      <label>Elevation gain<input name="elevation_gain" placeholder="915 ft"></label>
      <label>Difficulty<input name="difficulty" placeholder="Moderate"></label>
      <label>Expected campus return<input name="campus_return" placeholder="Around 3 p.m."></label>
      <label class="wide">Trail link<input name="trail_url" type="url" pattern="https?://.+" placeholder="https://www.alltrails.com/…"></label>
      <label class="wide">Trailhead directions<textarea name="trailhead" rows="2" placeholder="See AllTrails link"></textarea></label>
      <label class="wide">What to bring<textarea name="what_to_bring" rows="3" placeholder="Water, sunscreen, hiking shoes"></textarea></label>
    </div>
    <p class="form-error" role="alert"></p>
    <div class="acts"><button type="button" class="ghost" data-act="cancel">Cancel</button><button type="submit">Save hike</button></div>
  </form>
</dialog>
<dialog id="seatEditor" aria-labelledby="seatEditorTitle">
  <form><h2 id="seatEditorTitle">Edit passenger seats</h2>
    <p class="context"></p>
    <div class="fields"><label>Total passenger seats<input name="seats" type="number" min="1" max="20" step="1" required></label></div>
    <p class="form-error" role="alert"></p>
    <div class="acts"><button type="button" class="ghost" data-act="cancel">Cancel</button><button>Save seats</button></div>
  </form>
</dialog>
<datalist id="feeOptions"><option value="Waived"></option></datalist>
<dialog id="feeEditor" aria-labelledby="feeEditorTitle">
  <form><h2 id="feeEditorTitle">Edit carpool fee</h2>
    <p class="context"></p>
    <div class="fields"><label>Fee per passenger<input name="passenger_fee" list="feeOptions" placeholder="e.g. $4 or Waived"></label></div>
    <p class="form-error" role="alert"></p>
    <div class="acts"><button type="button" class="ghost" data-act="cancel">Cancel</button><button>Save fee</button></div>
  </form>
</dialog>
<dialog id="signup" aria-labelledby="signupTitle">
  <form><h2 id="signupTitle">Sign up</h2>
    <p class="context"></p>
    <div class="fields">
      <label>Your name<input name="name" required maxlength="60" autocomplete="name"></label>
      <label>Your phone number<input name="phone" type="tel" required maxlength="30" autocomplete="tel"></label>
      <label class="wide" hidden>Passenger seats (excluding you)<input name="seats" type="number" min="1" max="20" step="1" required disabled></label>
      <label class="wide" hidden>Your fee per passenger<input name="passenger_fee" list="feeOptions" placeholder="e.g. $4 or Waived" disabled></label>
    </div>
    <p class="form-error" role="alert"></p>
    <div class="acts"><button type="button" class="ghost" data-act="cancel">Cancel</button><button type="submit">Sign up</button></div>
  </form>
</dialog>
<dialog id="removeFromRoster" aria-labelledby="removalTitle">
  <form><h2 id="removalTitle">Remove from roster?</h2>
    <p class="context"></p>
    <label hidden><input type="checkbox" name="close_seat" disabled> Also decrease this car’s capacity by one seat</label>
    <p class="form-error" role="alert"></p>
    <div class="acts"><button type="button" class="ghost" data-act="cancel" autofocus>Cancel</button><button class="danger">Remove</button></div>
  </form>
</dialog>

<script>
// ====== 1. PASTE YOUR SUPABASE DETAILS HERE (Project Settings -> API) ======
const SUPABASE_URL = "https://nfrmrimelppvytlebayf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nJRZNTeG6kMIAyVyquaChA_X-Z4Nu20";
// ===========================================================================

const configured = !SUPABASE_URL.startsWith("PASTE");
let sb = null;
try { if (configured) sb = supabase.createClient(SUPABASE_URL.trim(), SUPABASE_ANON_KEY.trim()); }
catch (e) { window.addEventListener("DOMContentLoaded", () => { document.querySelector("#app").innerHTML = '<div class="setup"><strong>Could not start.</strong> ' + String(e.message || e) + '</div>'; }); }
let data = {dests: [], cars: [], riders: [], attendees: [], hikeFeatures: false};
let loadVersion = 0;
let hostPw = null;                 // kept in memory only; checked by the server on every host action
const forms = {};                  // typed-in values per destination, survive re-rendering
try { Object.assign(forms, JSON.parse(localStorage.getItem("carpoolForms") || "{}")); } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(text, isErr) {
  const m = $("#msg"); m.textContent = text; m.className = isErr ? "err" : "";
  m.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => m.style.display = "none", 3500);
}
function saveForms() { try { localStorage.setItem("carpoolForms", JSON.stringify(forms)); } catch (e) {} }
const f = id => forms[id] || (forms[id] = {name: "", phone: "", seats: 3});

async function load() {
  const version = ++loadVersion;
  if (!configured) {
    $("#app").innerHTML = '<div class="setup"><strong>Almost there.</strong> Open index.html and paste your Supabase project URL and anon key at the top of the script.</div>';
    return;
  }
  if (!sb) { $("#app").innerHTML = '<div class="setup"><strong>Supabase library did not load.</strong> Check your internet connection or ad blocker, then reload.</div>'; return; }
  let d, c, r, a;
  try { [d, c, r, a] = await Promise.all([
    sb.from("destinations").select("*").order("created_at"),
    sb.from("cars").select("*").order("created_at"),
    sb.from("riders").select("*").order("created_at"),
    sb.from("non_carpooling_attendees").select("*").order("created_at")
  ]); } catch (e) { if (version === loadVersion) $("#app").innerHTML = '<div class="setup"><strong>Could not reach Supabase.</strong> ' + esc(e.message || e) + '</div>'; return; }
  if (version !== loadVersion) return;
  // Keep existing carpools usable if the page is deployed before the database migration.
  const needsMigration = ["PGRST205", "42P01"].includes(a.error?.code);
  const err = d.error || c.error || r.error || (!needsMigration && a.error);
  if (err) { $("#app").innerHTML = '<div class="setup"><strong>Could not load data.</strong> ' + esc(err.message) + '</div>'; return; }
  data = {dests: d.data, cars: c.data, riders: r.data, attendees: a.data || [], hikeFeatures: !needsMigration};
  render();
}

function render() {
  $("#hostBtn").textContent = hostPw ? "Log out of host" : "Host login";
  $("#host").innerHTML = hostPw ? `<div class="hostbar"><strong>Host mode</strong>
    <button data-act="addDest">Add hike</button>
    ${data.hikeFeatures ? "" : "<span>Run migrations/001_hike_details.sql in Supabase to enable hike editing and non-carpooling signups.</span>"}</div>` : "";
  if (!data.dests.length) { $("#app").innerHTML = '<p class="empty">No trips yet. ' + (hostPw ? "Add a hike above." : "Check back once the host adds one.") + '</p>'; return; }
  $("#app").innerHTML = data.dests.map(destHTML).join("");
}

function webLink(value, label) {
  try {
    const url = new URL(value);
    if (["https:", "http:"].includes(url.protocol)) return `<a href="${esc(url.href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
  } catch {}
  return esc(value);
}

function hikeInfo(d) {
  const details = [
    ["Carpool meeting time", esc(d.meeting_time)], ["Carpool meeting location", webLink(d.meeting_location, d.meeting_location)],
    ["ETA at trailhead", esc(d.trailhead_eta)],
    ["Length", esc(d.distance)], ["Elevation gain", esc(d.elevation_gain)],
    ["Difficulty", esc(d.difficulty)], ["Expected campus return", esc(d.campus_return)],
    ["Trail link", webLink(d.trail_url, "View trail")], ["Trailhead", webLink(d.trailhead, d.trailhead)],
    ["What to bring", esc(d.what_to_bring)]
  ].filter(([, value]) => value);
  if (!details.length) return "";
  return `<dl class="hike-info">${details.map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join("")}</dl>`;
}

function destHTML(d) {
  const cars = data.cars.filter(c => c.destination_id === d.id);
  const riders = data.riders.filter(r => r.destination_id === d.id);
  const wait = riders.filter(r => !r.car_id);
  const attendees = data.attendees.filter(a => a.destination_id === d.id);
  const subtitle = d.passenger_fee && `Recommended fee per passenger: ${d.passenger_fee}`;
  const open = cars.reduce((n, c) => n + Math.max(0, c.seats - riders.filter(r => r.car_id === c.id).length), 0);
  const riderRow = (r, pos) => `<li class="${r.highlighted ? "hl" : ""}"><span>${pos ? pos + ". " : ""}${esc(r.name)}<span class="ph">${esc(r.phone)}</span></span>
    ${hostPw ? `<span class="acts"><button class="ghost small" data-act="hl" data-id="${r.id}">${r.highlighted ? "Unhighlight" : "Highlight"}</button><button class="danger small" data-act="kick" data-id="${r.id}">Remove</button></span>` : ""}</li>`;
  return `<section class="dest" data-dest="${d.id}">
    <div class="head"><div><h2>${esc(d.name)}</h2>${subtitle ? `<p>${esc(subtitle)}</p>` : ""}</div>
      ${hostPw ? `<div class="acts">${data.hikeFeatures ? '<button class="ghost small" data-act="editHike">Edit hike</button>' : ""}<button class="danger small" data-act="delDest" data-id="${d.id}">Delete destination</button></div>` : ""}</div>
    <div class="body">
      ${hikeInfo(d)}
      <button data-act="offer">I’m driving</button>
      ${cars.length ? cars.map(c => {
        const rs = riders.filter(r => r.car_id === c.id), left = c.seats - rs.length;
        return `<div class="car ${left <= 0 ? "full" : ""}">
          <div class="top"><div><span class="who">${esc(c.driver_name)}</span> <span class="meta">${esc(c.phone)}</span></div>
          <span class="seats">${left > 0 ? left + " of " + c.seats + " seats open" : "Full"}</span></div>
          ${"passenger_fee" in c ? `<p class="car-fee">Fee per passenger: <strong>${esc(c.passenger_fee || "Not specified")}</strong></p>` : ""}
          <ul>${rs.map(r => riderRow(r)).join("")}${left > 0 ? `<li class="open-seat"><span>${left} open ${left === 1 ? "seat" : "seats"}</span><button class="small" data-act="join" data-id="${c.id}">Take a seat</button></li>` : ""}</ul>
          ${hostPw ? `<div class="acts" style="margin-top:8px">${data.hikeFeatures ? `<button class="ghost small" data-act="editSeats" data-id="${c.id}">Edit seats</button>` : ""}${"passenger_fee" in c ? `<button class="ghost small" data-act="editFee" data-id="${c.id}">Edit fee</button>` : ""}<button class="danger small" data-act="delCar" data-id="${c.id}">Remove car</button></div>` : ""}
        </div>`;
      }).join("") : '<p class="empty">No drivers yet. Be the first to offer a ride.</p>'}
      ${cars.length && open === 0 ? `<div class="wait"><h3>Waitlist (${wait.length})</h3>
        <button data-act="wait">Join the waitlist</button></div>` : ""}
      ${wait.length ? `<div class="wait" style="${open === 0 ? "border:0;padding-top:0;margin-top:8px" : ""}">${open === 0 ? "" : "<h3>Waitlist (" + wait.length + ")</h3>"}<ul>${wait.map((r, i) => riderRow(r, i + 1)).join("")}</ul></div>` : ""}
      ${data.hikeFeatures ? `<section class="attendees"><h3>Non-carpooling attendees (${attendees.length})</h3>
        <ul>${attendees.map(a => `<li><span>${esc(a.name)}<span class="ph">${esc(a.phone)}</span></span>
        ${hostPw ? `<button class="danger small" data-act="removeAttendee" data-id="${a.id}">Remove</button>` : ""}</li>`).join("")}</ul>
        <button class="ghost" data-act="registerAttendee">Sign up without a carpool</button></section>` : ""}
    </div></section>`;
}

async function call(fn, args, ok) {
  const {error} = await sb.rpc(fn, args);
  if (error) toast(error.message, true); else if (ok) toast(ok);
  await load();
}

function openForm(selector, id, values, context) {
  const dialog = $(selector), form = dialog.querySelector("form");
  form.reset();
  form.dataset.id = id;
  for (const field of form.elements) {
    if (field.name && field.name in values) field.value = values[field.name] ?? "";
  }
  form.querySelector(".form-error").textContent = "";
  if (context) form.querySelector(".context").textContent = context;
  dialog.showModal();
  return form;
}

const signupActions = {
  offer: {title: "Offer a ride", fn: "add_car", message: "You’re listed as a driver."},
  join: {title: "Take a seat", fn: "join_car", message: "Seat taken."},
  wait: {title: "Join the waitlist", fn: "join_waitlist", message: "You’re on the waitlist."},
  registerAttendee: {title: "Sign up without a carpool", fn: "register_non_carpooling", message: "You’re on the non-carpooling roster."}
};

function openSignup(action, dest, carId) {
  const {title} = signupActions[action];
  const car = action === "join" && data.cars.find(c => c.id === carId);
  const seats = $("#signup [name=seats]");
  seats.disabled = action !== "offer";
  seats.parentElement.hidden = seats.disabled;
  const fee = $("#signup [name=passenger_fee]");
  // Packing notes and per-car fees ship in the same migration, including for hikes with no cars yet.
  fee.disabled = action !== "offer" || !("what_to_bring" in dest);
  fee.parentElement.hidden = fee.disabled;
  $("#signupTitle").textContent = title;
  $("#signup button[type=submit]").textContent = action === "registerAttendee" ? "Sign up" : title;
  let context = dest.name;
  if (car) {
    context += ` · ${car.driver_name}’s car`;
    if ("passenger_fee" in car) context += ` · Fee per passenger: ${car.passenger_fee || "Not specified"}`;
  }
  const form = openForm("#signup", carId || dest.id, {...f(dest.id), passenger_fee: dest.passenger_fee}, context);
  form.dataset.action = action;
  form.dataset.dest = dest.id;
}

// Each confirmation describes its own consequences and uses the same Cancel / Remove controls.
let pendingRemoval;
function confirmRemoval(title, context, fn, args, carToShrink) {
  pendingRemoval = {fn, args, carToShrink};
  $("#removalTitle").textContent = title;
  const checkbox = $("#removeFromRoster [name=close_seat]");
  checkbox.disabled = !carToShrink;
  checkbox.parentElement.hidden = checkbox.disabled;
  $("#removeFromRoster button.danger").textContent = fn === "host_delete_destination" ? "Delete destination" : "Remove";
  openForm("#removeFromRoster", "", {}, context);
}

document.addEventListener("submit", async e => {
  const form = e.target, dialog = form.closest("dialog");
  if (!dialog) return;
  e.preventDefault();
  if (form.dataset.saving) return;
  const id = form.dataset.id, values = Object.fromEntries(new FormData(form));
  let fn, args, message;
  switch (dialog.id) {
    case "hikeEditor":
      fn = id ? "host_edit_hike" : "host_add_destination";
      args = {p_pw: hostPw};
      if (id) args.p_dest = id;
      for (const [key, value] of Object.entries(values)) args["p_" + key] = value.trim();
      if (!id) {
        if (!args.p_what_to_bring) delete args.p_what_to_bring;
        args.p_name ||= "Untitled hike";
        // The original name-only function also works before the latest migration.
        if (Object.entries(values).every(([key, value]) => key === "name" || !value.trim()))
          args = {p_pw: hostPw, p_name: args.p_name};
      }
      message = id ? "Hike updated." : "Hike added.";
      break;
    case "seatEditor":
      fn = "host_set_car_seats";
      args = {p_pw: hostPw, p_car: id, p_seats: Number(values.seats)};
      message = "Seat count updated.";
      break;
    case "feeEditor":
      fn = "host_set_car_fee";
      args = {p_pw: hostPw, p_car: id, p_passenger_fee: values.passenger_fee.trim()};
      message = "Carpool fee updated.";
      break;
    case "signup": {
      const action = form.dataset.action;
      ({fn, message} = signupActions[action]);
      args = {p_name: values.name.trim(), p_phone: values.phone.trim()};
      if (action === "join") args.p_car = id;
      else args.p_dest = id;
      if (action === "offer") {
        args.p_seats = Number(values.seats);
        if ("passenger_fee" in values) args.p_passenger_fee = values.passenger_fee.trim();
      }
      break;
    }
    case "removeFromRoster":
      fn = pendingRemoval.fn;
      args = {p_pw: hostPw, ...pendingRemoval.args};
      if (values.close_seat && pendingRemoval.carToShrink) {
        fn = "host_kick_and_close_seat";
        args.p_car = pendingRemoval.carToShrink;
      }
      message = fn === "host_delete_destination" ? "Destination deleted." : "Removed from the roster.";
      break;
    default: return;
  }
  form.dataset.saving = "true";
  const buttons = form.querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);
  try {
    const {error} = await sb.rpc(fn, args);
    if (error && fn === "host_add_destination" && ["PGRST202", "42883"].includes(error.code))
      throw new Error("Run the updated migrations/001_hike_details.sql to save a new hike with details.");
    if (error) throw error;
    dialog.close();
    toast(message);
    await load();
  } catch (error) {
    form.querySelector(".form-error").textContent = error.message || "Could not save. Please try again.";
  } finally {
    delete form.dataset.saving;
    buttons.forEach(b => b.disabled = false);
  }
});
document.querySelectorAll("dialog").forEach(dialog => dialog.addEventListener("cancel", e => {
  if (dialog.querySelector("form").dataset.saving) e.preventDefault();
}));

$("#signup").addEventListener("input", e => {
  const field = e.target;
  if (field.name === "passenger_fee") return;
  f(field.form.dataset.dest)[field.name] = field.value;
  saveForms();
});

document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, sec = b.closest("[data-dest]");
  if (act === "cancel") return b.closest("dialog").close();
  const dest = sec && data.dests.find(d => d.id === sec.dataset.dest);
  if (act === "editHike" || act === "addDest") {
    const creating = act === "addDest";
    $("#hikeEditorTitle").textContent = creating ? "Add hike" : "Edit hike";
    $("#hikeEditor button[type=submit]").textContent = creating ? "Add hike" : "Save hike";
    const form = openForm("#hikeEditor", creating ? "" : dest.id, dest || {});
    form.elements.name.required = !creating;
    form.elements.name.placeholder = creating ? "Untitled hike" : "Fletcher Point";
    for (const field of form.querySelectorAll("[name]")) {
      field.disabled = creating ? field.name !== "name" && !data.hikeFeatures : !(field.name in dest);
    }
    if (form.elements.meeting_location.disabled) {
      form.querySelector(".form-error").textContent = "Run the updated migrations/001_hike_details.sql to enable all hike details.";
    }
    return;
  }
  if (act === "editSeats") {
    const car = data.cars.find(c => c.id === id);
    const occupied = data.riders.filter(r => r.car_id === id).length;
    return openForm("#seatEditor", id, car, `${car.driver_name}’s car · ${occupied} occupied of ${car.seats} passenger seats`);
  }
  if (act === "editFee") {
    const car = data.cars.find(c => c.id === id);
    return openForm("#feeEditor", id, car, `${dest.name} · ${car.driver_name}’s car`);
  }
  if (Object.hasOwn(signupActions, act)) return openSignup(act, dest, id);
  if (act === "removeAttendee") {
    const attendee = data.attendees.find(a => a.id === id);
    return confirmRemoval("Remove attendee?", `Remove ${attendee.name} from the non-carpooling roster for ${dest.name}?`, "host_remove_attendee", {p_attendee: id});
  }
  if (act === "hostToggle") {
    if (hostPw) { hostPw = null; return render(); }
    const pw = prompt("Host password:"); if (!pw) return;
    const {data: okLogin, error} = await sb.rpc("host_login", {p_pw: pw});
    if (error || !okLogin) return toast("Wrong password.", true);
    hostPw = pw; return render();
  }
  if (act === "delDest") return confirmRemoval("Delete destination?", `Delete ${dest.name} and all its cars, passengers, waitlisted riders, and non-carpooling attendees?`, "host_delete_destination", {p_id: id});
  if (act === "hl") return call("host_toggle_highlight", {p_pw: hostPw, p_rider: id});
  if (act === "kick") {
    const rider = data.riders.find(r => r.id === id), car = data.cars.find(c => c.id === rider.car_id);
    const context = car ? `Remove ${rider.name} from ${car.driver_name}’s car? The next waitlisted rider can take the open seat.` : `Remove ${rider.name} from the waitlist for ${dest.name}?`;
    return confirmRemoval("Remove passenger?", context, "host_kick", {p_rider: id}, data.hikeFeatures && car && car.seats > 1 && car.id);
  }
  if (act === "delCar") {
    const car = data.cars.find(c => c.id === id);
    return confirmRemoval("Remove car?", `Remove ${car.driver_name}’s car? Its passengers move to open seats or the waitlist.`, "host_delete_car", {p_car: id});
  }
});

load();
setInterval(() => { if (!$("dialog[open]") && !document.activeElement.matches("input, textarea")) load(); }, 10000);
</script>
</body>
</html>
